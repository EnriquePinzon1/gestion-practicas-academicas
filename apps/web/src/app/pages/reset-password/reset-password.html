<div class="reset-page">

  <div class="reset-card">

    <div class="brand">

      <h1>
        Nueva contraseña
      </h1>

      <p>
        Establece una nueva contraseña
        para tu cuenta.
      </p>

    </div>

    <form
      (ngSubmit)="updatePassword()"
    >

      <div class="field">

        <label for="password">
          Nueva contraseña
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Nueva contraseña"
          autocomplete="new-password"
        />

      </div>

      <div class="field">

        <label for="confirmPassword">
          Confirmar contraseña
        </label>

        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          placeholder="Repita la contraseña"
          autocomplete="new-password"
        />

      </div>

      @if (errorMessage()) {
        <div class="message error">
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="message success">
          {{ successMessage() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
      >
        {{
          loading()
            ? 'Actualizando...'
            : 'Guardar nueva contraseña'
        }}
      </button>

    </form>

  </div>

</div>
